<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Exercicio array, function and objects</title>
</head>
<body>
    <form id="formulario" method="get">
        <label for="nome">Nome completo: </label>
        <input type="text" id="nome" name="nome" placeholder="Digite aqui...">

        <label for="idade">Idade: </label>
        <input type="number" id="idade" name="idade" placeholder="Digite aqui...">

        <label for="peso">Peso: </label>
        <input type="number" id="peso" name="peso" placeholder="Digite aqui..." step="any">

        <label for="altura">Altura: </label>
        <input type="number" id="altura" name="altura" placeholder="Digite aqui..." step="any">

        <button type="submit">Enviar</button>
    </form>

    <div id="data">

    </div>
    
    <script src="index.js"></script>
</body>

</html>
